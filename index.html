<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="%BASE_URL%favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win Predict AI</title>
    <script>
      (function () {
        try {
          var supported = ['en', 'de', 'fr', 'es', 'it', 'ru']
          var localeRaw = localStorage.getItem('locale')
          var locale = localeRaw ? JSON.parse(localeRaw) : null
          if (supported.indexOf(locale) === -1) {
            var language = navigator.language.toLowerCase()
            locale = 'en'
            for (var i = 0; i < supported.length; i++) {
              var code = supported[i]
              if (language === code || language.indexOf(code + '-') === 0) {
                locale = code
                break
              }
            }
          }
          document.documentElement.lang = locale

          var schemeRaw = localStorage.getItem('vueuse-color-scheme')
          var preference = schemeRaw ? JSON.parse(schemeRaw) : 'auto'
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var isDark = preference === 'dark' || (preference !== 'light' && prefersDark)
          document.documentElement.classList.toggle('dark', isDark)

          var paletteRaw = localStorage.getItem('color-palette-preferences')
          var palettePrefs = paletteRaw ? JSON.parse(paletteRaw) : null
          var supportedPalettes = ['zinc', 'slate-teal', 'claude-plus']
          var defaultPalette = 'slate-teal'
          function resolvePalette(value) {
            return supportedPalettes.indexOf(value) !== -1 ? value : defaultPalette
          }
          var lightPalette = palettePrefs
            ? resolvePalette(palettePrefs.light)
            : defaultPalette
          var darkPalette = palettePrefs
            ? resolvePalette(palettePrefs.dark)
            : defaultPalette
          document.documentElement.setAttribute('data-palette', isDark ? darkPalette : lightPalette)
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
