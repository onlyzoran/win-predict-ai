# Copied for domain cutover via Actions (secrets live in this repo).
# Source of truth also in win-predict-ai-admin/deploy/nginx.conf

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name win-predict-ai.com www.win-predict-ai.com;

    client_max_body_size 2m;

    location = /ops {
        return 301 /ops/;
    }

    location ^~ /ops/ {
        alias /var/www/orchestrator-status/;
        index index.html;
        add_header Cache-Control "no-store";
    }

    location /win-predict-ai/ {
        alias /var/www/win-predict-ai/dist/;
        try_files $uri $uri/ /win-predict-ai/index.html;
    }

    location /win-predict-ai-preview/ {
        alias /var/www/win-predict-ai-preview/;
        autoindex off;
        try_files $uri $uri/ =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
