# Public app at /, admin at /admin/, public API at /api/ (proxied to Nuxt /admin/api/).
# Keep in sync with win-predict-ai-admin/deploy/nginx.conf

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name win-predict-ai.com www.win-predict-ai.com;

    client_max_body_size 2m;

    location = /ops {
        return 301 /ops/;
    }

    location ^~ /ops/ {
        alias /var/www/orchestrator-status/;
        index index.html;
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000/admin/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:3000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /win-predict-ai-preview/ {
        alias /var/www/win-predict-ai-preview/;
        autoindex off;
        try_files $uri $uri/ =404;
    }

    location /app-preview/ {
        alias /var/www/win-predict-ai-app-preview/;
        index index.html;
        autoindex off;
        try_files $uri $uri/ =404;
    }

    location = /win-predict-ai {
        return 301 /;
    }

    location /win-predict-ai/ {
        rewrite ^/win-predict-ai/(.*)$ /$1 permanent;
    }

    location / {
        root /var/www/win-predict-ai/dist;
        try_files $uri $uri/ /index.html;
    }
}
