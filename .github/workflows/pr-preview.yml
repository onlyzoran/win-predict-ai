name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  packages: read

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@onlyzoran'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with preview base path
        run: npm run build
        env:
          VITE_BASE_PATH: /win-predict-ai-preview/pr-${{ github.event.number }}/

      - name: Install SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy preview to VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p ${{ secrets.VPS_PREVIEW_ROOT }}/pr-${{ github.event.number }}"
          rsync -avz --delete \
            -e 'ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes' \
            dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PREVIEW_ROOT }}/pr-${{ github.event.number }}/"

      - name: Resolve Goal issue number from PR body
        id: goal
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          GOAL_ISSUE="$(printf '%s' "$PR_BODY" | grep -Eo 'win-predict-ai-orchestrator#[0-9]+' | head -1 | cut -d# -f2 || true)"
          if [[ -n "$GOAL_ISSUE" ]]; then
            echo "issue=$GOAL_ISSUE" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Goal-demo (orchestrator preview URL)
        if: steps.goal.outputs.issue != ''
        run: npm run build
        env:
          VITE_BASE_PATH: /app-preview/issue-${{ steps.goal.outputs.issue }}/

      - name: Deploy Goal-demo to VPS
        if: steps.goal.outputs.issue != ''
        env:
          GOAL_ISSUE: ${{ steps.goal.outputs.issue }}
        run: |
          APP_PREVIEW_ROOT="${VPS_APP_PREVIEW_ROOT:-/var/www/win-predict-ai-app-preview}"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p ${APP_PREVIEW_ROOT}/issue-${GOAL_ISSUE}"
          rsync -avz --delete \
            -e 'ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes' \
            dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${APP_PREVIEW_ROOT}/issue-${GOAL_ISSUE}/"

      - name: Ensure nginx serves /app-preview/
        if: steps.goal.outputs.issue != ''
        run: |
          rsync -avz \
            -e 'ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes' \
            deploy/ensure-app-preview-nginx.sh \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/ensure-app-preview-nginx.sh"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "chmod +x /tmp/ensure-app-preview-nginx.sh && /tmp/ensure-app-preview-nginx.sh"

      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            🔗 **Preview deployed:** http://${{ secrets.VPS_HOST }}/win-predict-ai-preview/pr-${{ github.event.number }}/
            ${{ steps.goal.outputs.issue && format('🎯 **Goal-demo:** https://win-predict-ai.com/app-preview/issue-{0}/', steps.goal.outputs.issue) || '' }}

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Remove preview from VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "rm -rf ${{ secrets.VPS_PREVIEW_ROOT }}/pr-${{ github.event.number }}"

      - name: Update PR comment on close
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            ~~🔗 Preview~~ (удалён после закрытия PR)
